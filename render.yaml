# Blueprint de Render.
#
# Crea el servicio web con los ajustes correctos en un solo clic:
#   https://render.com/deploy?repo=https://github.com/44JACK44-cmd/vibegrab-website
#
# Las variables marcadas con `sync: false` se piden al desplegar (las
# rellenas tú en el panel de Render).
services:
  - type: web
    name: vibegrab-website
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      # El adaptador se detecta solo: Render define RENDER=true al compilar.
      # Se puede forzar con DEPLOY_TARGET=render.
      - key: DEPLOY_TARGET
        value: render
      - key: NODE_VERSION
        value: "22"
      # Dominio propio. Opcional: Render publica su URL en
      # RENDER_EXTERNAL_URL y la web la usa sola.
      - key: SITE_URL
        sync: false
      # Token de GitHub con permiso `public_repo`. Necesario para que el canal
      # de opiniones de la comunidad pueda guardar las opiniones.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: 44JACK44-cmd/vibeGrab
      - key: RELEASES_CACHE_MINUTES
        value: "10"
      - key: REVIEWS_CACHE_MINUTES
        value: "10"
