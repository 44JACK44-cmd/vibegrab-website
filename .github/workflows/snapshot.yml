name: Refresh releases snapshot

# Mantiene actualizado el respaldo local que se usa si GitHub no responde.
# La web no depende de este workflow para publicar versiones nuevas: consulta
# la API en cada petición (con caché). Esto solo mejora el modo degradado.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regenerar snapshot
        # Un fallo puntual de la API (límite de peticiones, caída) no debe
        # marcar el workflow como fallido: el respaldo solo mejora el modo
        # degradado y la web consulta GitHub en cada petición.
        continue-on-error: true
        run: npm run snapshot

      - name: Guardar cambios si hay versiones nuevas
        run: |
          if git diff --quiet -- src/data/releases.snapshot.json; then
            echo "Sin cambios en las publicaciones."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/releases.snapshot.json
          git commit -m "chore: actualizar snapshot de releases"
          git push
